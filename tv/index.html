<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>TV Salsa Soul Studio</title>
<link rel="icon" href="/logo-dorado.png">
<style>
  /* ══ Paleta Salsa Soul (la misma de /fotos y la home) ══ */
  :root{
    --gold:#c9a84c; --gold-light:#e8c96a; --gold-dark:#8a6820;
    --black:#0a0a0a; --dark:#111; --dark2:#1a1a1a;
    --serif:Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    height:100%; overflow:hidden; background:var(--black); color:#fff;
    font-family:var(--sans); user-select:none; cursor:none;
  }

  /* ══ Escenario: capas apiladas que hacen cross-fade ══ */
  #escenario{position:fixed;inset:0;z-index:1;background:var(--black)}
  .capa{
    position:absolute;inset:0; opacity:0; transition:opacity .9s ease;
    display:flex;align-items:center;justify-content:center; overflow:hidden;
  }
  .capa.visible{opacity:1}

  /* Video y foto a pantalla completa */
  .capa video, .capa .foto{width:100%;height:100%;object-fit:cover;display:block}

  /* Video VERTICAL (grabado con el celular): con `cover` se vería una franja del
     centro y se pierde medio cuadro. Va centrado y completo. */
  .capa.vertical video{
    position:relative; width:auto; height:100%; max-width:100%; object-fit:contain;
    box-shadow:0 24px 80px rgba(0,0,0,.75);
  }
  /* Fondo de degradado y no una copia borrosa del video: reproducir DOS videos a la
     vez (uno con blur a pantalla completa) es lo que entrecorta a una TV modesta. */
  .capa.vertical{
    background:radial-gradient(ellipse at 50% 40%, #241d10 0%, #12100b 55%, var(--black) 100%);
  }

  /* Video de ARCHIVO (el saludo de Eddie Torres son 320x240, hay varios de 640x352):
     estirarlo a pantalla completa en un panel de 65" lo convierte en una mancha y le
     pide a la TV un upscale enorme. Va centrado a una altura razonable, sobre el mismo
     fondo que los verticales: se ve mejor Y le saca trabajo al panel. */
  .capa.chico{
    background:radial-gradient(ellipse at 50% 40%, #241d10 0%, #12100b 55%, var(--black) 100%);
  }
  .capa.chico video{
    position:relative; width:auto; height:78%; max-width:92%; object-fit:contain;
    box-shadow:0 24px 80px rgba(0,0,0,.75);
  }

  /* Afiche: contain + fondo borroso de la misma imagen (los afiches son
     verticales; sin esto quedan dos barras negras enormes a los costados) */
  .capa .fondoBlur{
    position:absolute;inset:-6%; width:112%;height:112%; object-fit:cover;
    filter:blur(38px) brightness(.35) saturate(1.2); transform:scale(1.06);
  }
  .capa .afiche{
    position:relative; max-width:94%; max-height:94%; object-fit:contain;
    border-radius:10px; box-shadow:0 24px 80px rgba(0,0,0,.75), 0 0 0 1px rgba(201,168,76,.22);
  }

  /* Foto que NO es panorámica: entera, con el mismo fondo borroso del afiche.
     `cover` a pantalla completa está bien para una 3:2 (pierde 16% del alto) y es
     una masacre para una vertical: se ve un tercio de la foto y lo primero que se
     va son las cabezas. Medido el 14/09/2026 sobre el archivo real: el 39% de las
     fotos de Salsa y el 84% de las de Mamba son verticales, con una mediana de
     recorte del 58% del alto. Iván: "muchas fotos corta la cabeza".
     Al 94% del alto, como el afiche: el Ken Burns suave (×1.05) todavía entra en
     pantalla sin comerse un borde. */
  .capa .foto.entera{
    position:relative; width:auto; height:auto;
    max-width:94%; max-height:94%; object-fit:contain;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
  }

  /* Ken Burns: la foto respira, no se queda estática como un cuadro muerto.
     El zoom NO sube más: terminaba en translate(-1.2%, -1.6%), que corre la imagen
     hacia arriba y deja ver la parte de abajo — o sea que le comía la cabeza a la
     gente justo sobre el final del plano, que es cuando más se la mira. */
  @keyframes kenburns{
    0%  {transform:scale(1.02) translate(0,0)}
    100%{transform:scale(1.14) translate(-1.2%, 0)}
  }
  /* La entera no puede crecer tanto: pasado el 100% del alto empieza a cortar,
     que es exactamente lo que vino a evitar. */
  @keyframes kenburnsEntera{
    0%  {transform:scale(1)}
    100%{transform:scale(1.05)}
  }
  .capa .foto.kb{animation:kenburns var(--kb,10s) ease-out forwards}
  .capa .foto.entera.kb{animation-name:kenburnsEntera}
  /* Las panorámicas que sí van a pantalla completa se anclan arriba: en una foto de
     grupo las caras están en el tercio superior, y el recorte de `cover` es el de
     abajo (piso, piernas), que no lo extraña nadie. */
  .capa .foto:not(.entera){object-position:center 38%}

  /* ══ Modo liviano (/tv?liviano=1) ══
     Para la Smart TV: el desenfoque a pantalla completa y el Ken Burns son lo
     más caro que hace la página, y en un panel 4K con GPU modesta se entrecorta.
     Sin ellos la pantalla se ve igual de prolija y va fluida: el fondo del
     afiche pasa a ser un degradado (cuesta cero) y la foto queda quieta. */
  body.liviano .capa .fondoBlur{display:none}
  body.liviano .capa.conAfiche{
    background:radial-gradient(ellipse at 50% 35%, #241d10 0%, #12100b 55%, var(--black) 100%);
  }
  body.liviano .capa .foto.kb{animation:none}

  /* ══ Tarjeta de noticia ══ */
  .noticia{
    position:relative; width:100%;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3.2vh; padding:6vh 9vw; text-align:center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.16) 0%, transparent 62%),
      linear-gradient(160deg, #12100b 0%, var(--black) 55%, #0d0b07 100%);
  }
  .noticia .kicker{
    font-family:var(--sans); font-size:2.1vh; letter-spacing:.42em; text-transform:uppercase;
    color:var(--gold); opacity:.95;
  }
  .noticia h1{
    font-family:var(--serif); font-weight:normal; line-height:1.06;
    font-size:min(9.6vh, 7.4vw);
    background:linear-gradient(180deg,#fff 30%,var(--gold-light) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(201,168,76,.10);
  }
  .noticia p{
    font-family:var(--serif); font-size:min(4.4vh,3.6vw); line-height:1.45;
    color:#e9e3d4; max-width:24ch;
  }
  .noticia .linea{width:16vh;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  /* QR de la noticia: se mira desde el otro lado de la cantina, así que va grande y
     sobre blanco — un QR sobre fondo oscuro no lo lee ninguna cámara. `pixelated`
     para que al agrandarlo los módulos queden con el borde duro. */
  .noticia .qr{margin-top:2.2vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh}
  .noticia .qr img{width:30vh;height:30vh;background:#fff;padding:1.5vh;border-radius:1.2vh;
    image-rendering:pixelated;box-shadow:0 6px 30px rgba(0,0,0,.55)}
  .noticia .qr span{font-family:var(--sans);font-size:1.9vh;color:var(--gold-light);
    opacity:.92;letter-spacing:.05em}

  /* ══ Marca fija abajo (logo + pie) ══ */
  #marca{
    position:fixed; z-index:3; left:0;right:0;bottom:0; height:13vh;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 3.4vw 2.6vh; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.82) 0%, rgba(0,0,0,.42) 45%, transparent 100%);
  }
  #marca img{height:7.6vh; filter:drop-shadow(0 3px 12px rgba(0,0,0,.9)); opacity:.96}
  #pie{
    text-align:right; font-family:var(--serif); line-height:1.35;
    text-shadow:0 2px 14px rgba(0,0,0,.95);
    transition:opacity .42s ease;
  }
  #pieTitulo{font-size:2.9vh; color:#fff; opacity:.97}
  #pieSub{font-size:2.1vh; color:var(--gold-light); opacity:.9; letter-spacing:.06em}

  /* ══ Barra de progreso del item (hilo dorado, discreto) ══ */
  #progreso{position:fixed;z-index:4;left:0;bottom:0;height:3px;width:0;
    background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));
    box-shadow:0 0 10px rgba(201,168,76,.6)}

  /* ══ Pantalla de arranque / errores ══ */
  #estado{
    position:fixed;inset:0;z-index:9; display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.4vh; background:var(--black);
    transition:opacity .8s ease;
  }
  #estado.oculto{opacity:0;pointer-events:none}
  #estado img{height:11vh;opacity:.92}
  #estado .msg{font-family:var(--serif);font-size:2.8vh;color:var(--gold-light);opacity:.85}
  #estado .sub{font-family:var(--sans);font-size:1.9vh;color:#8a8478}

  /* Aviso de sonido bloqueado: solo aparece si el navegador rechaza el audio */
  #avisoSonido{
    position:fixed;z-index:8;top:3vh;left:50%;transform:translateX(-50%);
    padding:1.4vh 3vw; border-radius:999px; background:rgba(10,10,10,.88);
    border:1px solid rgba(201,168,76,.5); color:var(--gold-light);
    font-family:var(--sans); font-size:2.1vh; display:none;
  }
  #avisoSonido.on{display:block}
</style>
</head>
<body>

<div id="escenario"></div>

<div id="marca">
  <img class="logoMarca" src="/tv/logo-tv.png" alt="Salsa Soul Studio">
  <div id="pie">
    <div id="pieTitulo">Salsa Soul Studio</div>
    <div id="pieSub">Disfruta la vida bailando</div>
  </div>
</div>
<div id="progreso"></div>

<div id="avisoSonido">🔇 Apretá cualquier botón del control para el sonido</div>

<div id="estado">
  <img class="logoMarca" src="/tv/logo-tv.png" alt="">
  <div class="msg">Preparando la pantalla…</div>
  <div class="sub" id="estadoSub"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   TV Salsa Soul — cartelera de la academia
   ---------------------------------------------------------------------------
   Corre en la Smart TV de la cantina (Tokyo 65" Android TV, Fully Kiosk Browser),
   ~19:30 a 22:00. Tambien sirve en una notebook por HDMI con Chrome en kiosk.

   Fuentes de contenido (todas remotas, se releen solas):
     1. R2 /tv/playlist.json  → videos, fotos históricas, afiches y noticias que
        Iván carga en la carpeta TV-ACADEMIA y sincroniza con tools/tv_sync.py
     2. R2 /manifest.json     → las fotos de las clases (el MISMO índice que usa
        salsasoulstudio.com/fotos: si subís fotos por WhatsApp, entran acá solas)
     3. /tv/playlist.json     → copia de respaldo en el repo, por si R2 no responde

   La página recibe un inventario y arma la SECUENCIA acá (ver EL GUION más abajo):
   video de un festival → sus propias fotos → horarios → social → un día de clase.
   Iván solo tira archivos en la carpeta; la subcarpeta es el evento al que pertenecen.
   ═══════════════════════════════════════════════════════════════════════════ */

const R2 = "https://pub-1fc0fb1ac8244995981fc724066bf71c.r2.dev";

/* Modo liviano para la Smart TV: /tv?liviano=1 — apaga el desenfoque de fondo y
   el movimiento de las fotos, que es lo que hace sufrir a una GPU de TV en 4K. */
const PARAMS = new URLSearchParams(location.search);
const LIVIANO = PARAMS.has("liviano");
if(LIVIANO) document.body.classList.add("liviano");

/* LA MARCA: /tv?marca=mamba — Salsa Soul y Mamba Basket comparten el local y las
   pantallas, con horarios distintos. Cada una tiene su propio archivo y su propio
   prefijo en R2 (ver MARCAS en tools/tv_sync.py); acá se elige de cuál se lee.
   Sin el parámetro es Salsa Soul, que es la que ya está en el aire: una TV que hoy
   apunta a /tv sigue mostrando exactamente lo mismo que mostraba ayer. */
const MARCAS = {
  salsa: {
    nombre: "Salsa Soul Studio",
    lema: "Disfruta la vida bailando",
    pie_web: "salsasoulstudio.com",
    playlist: "/tv/playlist.json",
    logo: "/tv/logo-tv.png",
    // Las fotos de las clases salen del MISMO manifiesto que salsasoulstudio.com/fotos.
    clases: true,
    // Los afiches se buscan POR NOMBRE de archivo: son los de Salsa Soul y no existen
    // en el archivo de Mamba, así que cada marca nombra los suyos.
    afiches_horarios: ["Horarios Principiante 1", "Horarios Basico 2",
                       "Horarios Basico 3", "Horarios Intermedio"],
    afiche_social: "Proximo Social"
  },
  mamba: {
    nombre: "Mamba Basket Academy",
    lema: "",
    pie_web: "",
    playlist: "/tv-mamba/playlist.json",
    logo: "/tv/logo-mamba.png",
    // Mamba no tiene galería de clases por WhatsApp: pedirle el manifiesto de Salsa
    // le metería fotos de salsa en la pantalla de básquet.
    clases: false,
    afiches_horarios: [],
    afiche_social: null,
    /* Mamba suena al 85% y Salsa al 38%, y es para que suenen IGUAL (Iván,
       14/09/2026: "la música de mamba está mucho más baja que la de salsa").
       No era la música: medidos los 12 temas con loudnorm, los de Mamba están
       1,3 dB MÁS fuertes que los de Salsa (-15,0 contra -16,3 LUFS). Lo que pasa
       es que el archivo de Mamba no tiene un solo video, y en Salsa lo que se
       escucha fuerte es el video, que va al 100%. Con la música al 38% la pantalla
       de Mamba quedaba 8,4 dB por debajo de lo que suena la misma tele después de
       las 19. El 0.85 iguala esos dos niveles, descontando el 1,3 dB que los temas
       ya traen de más. */
    volumen_musica: 0.85
  }
};
/* LAS TELES: /tv/entrada · /tv/cantina · /tv/gym · /tv/salon · /tv/lfm
   (las direcciones limpias las arma _redirects; por debajo es /tv/?tele=entrada)

   Cada pantalla del local tiene su propio programa, y lo único que cambia entre
   ellas es DE QUÉ ARCHIVO leen y A QUÉ HORA cambian de uno al otro (pedido de Iván,
   14/09/2026). El local lo comparten dos academias: hasta la hora del cambio la
   pantalla muestra el archivo de Mamba, y a partir de ahí el de Salsa Soul, que es
   cuando empiezan las clases de baile.

   `turno` reparte las teles a lo largo de la rueda de años (ver armarRuedaDeAnios):
   es lo que hace que a la misma hora cada pantalla esté mostrando un año distinto.

   SIN el parámetro `tele` la página se comporta EXACTAMENTE como antes del 14/09:
   Salsa Soul todo el día. Una tele apuntada a /tv a secas sigue andando igual. */
const TELES = {
  entrada: {nombre: "Entrada",      cambio: "19:00", turno: 0},
  cantina: {nombre: "Cantina",      cambio: "19:15", turno: 1},
  gym:     {nombre: "Gimnasio",     cambio: "19:30", turno: 2},
  salon:   {nombre: "Salón Salsa",  cambio: null,    turno: 3},   // salsa siempre
  // La tele de la tienda de ropa: la dirección ya existe, el material todavía no.
  // Hasta que se defina, pantalla negra con el logo — sin bajar un solo byte de R2.
  lfm:     {nombre: "LFM",          apagada: true,   turno: 4}
};
/* De dónde sale cuál tele es esta: del CAMINO (/tv/entrada) o del parámetro
   (/tv/?tele=entrada). Las dos formas hacen falta y no es redundancia: el rewrite de
   Cloudflare (`/tv/entrada /tv/index.html?tele=entrada 200`) sirve el archivo pero la
   barra del navegador sigue diciendo /tv/entrada SIN el `?`, así que del lado del
   navegador el parámetro no existe. El que se tipea en la tele es el camino; el
   parámetro queda para probar desde la notebook sin pasar por Cloudflare. */
const _SEG = location.pathname.replace(/\/+$/, "").split("/").pop() || "";
const _TELE_PEDIDA = PARAMS.get("tele") || _SEG;
const TELE = TELES[_TELE_PEDIDA] ? _TELE_PEDIDA : null;
const T = TELE ? TELES[TELE] : null;
const APAGADA = !!(T && T.apagada);

// "HH:MM" en Paraguay. h23 y no hour12:false: algunos navegadores devuelven "24:05"
// pasada la medianoche con hour12:false, y "24:05" > "19:00" es la comparación al revés.
function horaPY(){
  return new Intl.DateTimeFormat("en-GB", {timeZone: "America/Asuncion",
    hour: "2-digit", minute: "2-digit", hourCycle: "h23"}).format(new Date());
}

// Qué academia le toca a esta tele AHORA. `?marca=` sigue mandando sobre el horario:
// sirve para probar el archivo de Mamba a cualquier hora sin esperar al programa.
function marcaDeAhora(){
  const forzada = PARAMS.get("marca");
  if(MARCAS[forzada]) return forzada;
  if(!T || !T.cambio) return "salsa";
  return horaPY() < T.cambio ? "mamba" : "salsa";
}

const MARCA = marcaDeAhora();
const M = MARCAS[MARCA];

// El logo y el pie de la marca, antes de que se dibuje el primer item: si se dejaran
// para después, la pantalla de "Preparando…" arranca con el logo de la otra academia.
// La tele apagada es la excepción: muestra el logo de Salsa Soul, no el de la marca
// que le tocaría por horario.
const LOGO = APAGADA ? MARCAS.salsa.logo : M.logo;
document.querySelectorAll(".logoMarca").forEach(img => { img.src = LOGO; img.alt = M.nombre; });
document.getElementById("pieTitulo").textContent = M.nombre;
document.getElementById("pieSub").textContent = M.lema;
document.title = "TV " + (T ? T.nombre + " · " : "") + M.nombre;

const CONFIG_DEFAULT = {
  segundos_foto: 8,             // fotos de las clases
  segundos_foto_festival: 4,    // las del bloque del festival, más ágiles
  segundos_afiche: 13,          // el afiche tiene texto: hay que poder leerlo
  segundos_noticia: 11,
  // Corte de seguridad, en 7 minutos por decisión de Iván (06/09): ninguna coreografía
  // se corta a mitad de baile. Estaba en 3:30 —de cuando la tele solo tenía los videos
  // del canal— y cortaba 21 de los 131 videos. Sigue siendo un tope: un video roto o de
  // media hora no puede quedarse con la pantalla toda la noche.
  max_video: 420,
  // Cuánto se espera a que el video tenga buffer ANTES de fundir a él. Arrancaba con
  // el primer frame (`loadeddata`) y en la tele se trababa a los pocos segundos.
  espera_video: 12,
  // Si el video deja de avanzar este tiempo, se lo abandona y sigue la cartelera. Sin
  // esto, un video que nunca termina de bufferear se queda con la pantalla para siempre.
  tranque_video: 25,
  fotos_por_festival: 20,       // cuántas fotos van después del video de un festival
  afiche_cada: 5,               // cada cuántas de esas fotos vuelve el afiche del festival
  semanas_galeria: 8,           // ventana de fotos de clase que entra a la rotación
  volumen_musica: 0.38,         // la música es fondo, no protagonista
  afiches_horarios: ["Horarios Principiante 1", "Horarios Basico 2",
                     "Horarios Basico 3", "Horarios Intermedio"],
  afiche_social: "Proximo Social",
  refresco_min: 10,             // cada cuánto se relee el playlist (sin cortar nada)
  recarga_horas: 6              // recarga completa, por si queda muchas horas viva
};

let CFG = {...CONFIG_DEFAULT};
// "fijo" y "musica" no son tipos del patrón: el fijo sale después de CADA video y la
// música corre por abajo, en paralelo a lo que se ve.
let POOL = {video:[], foto:[], afiche:[], noticia:[], fijo:[], musica:[]};
let CURSOR = {video:0, foto:0, afiche:0, noticia:0, fijo:0};
let COLECCIONES = [];   // festivales: cada uno con SUS videos y SUS fotos
let DIAS_CLASE = [];    // fotos de las clases, agrupadas por día
let diaIdx = 0;   // colIdx murió con la rueda de años (anioIdx / CUR_ANIO)
let capaActual = null;
let sonidoOk = true;
let fallosSeguidos = 0;
let sinConexion = false;   // el cartel de "sin conexión" está puesto

/* ── Utilidades ────────────────────────────────────────────────────────────── */

/* ── El mando ───────────────────────────────────────────────────────────────
   Iván maneja las pantallas desde el celular (/mando en Dorita). La orden NO llega
   por un websocket: se deja en `<prefijo>/control.json` en R2 y la tele la lee cada
   pocos segundos. Así la cartelera NO DEPENDE del server — Railway se reinicia sin
   aviso y acá no se nota. Si el archivo no está, da 404 o viene roto, todo sigue
   exactamente como antes: el mando se suma, no se interpone. */
const MANDO_CADA_MS = 8000;
const MANDO_API = "https://salsa-soul-dorita-production.up.railway.app";
let SALTO = 0;                 // sube con cada orden de saltar: corta la espera en curso
let saltarColeccion = false;   // la próxima vuelta descarta lo que quede de esta tanda
let ultimaColeccion = null;
let ordenHecha = localStorage.getItem("tv_orden_hecha:" + MARCA) || "";
let OCULTAS = new Set();

/* La espera se corta si llega una orden (SALTO cambió). Sin esto, "Siguiente" tendría
   que esperar a que termine la foto: con un afiche de 13 s el botón se sentiría roto. */
const dormir = ms => new Promise(r => {
  const desde = SALTO, hasta = Date.now() + ms;
  const tic = setInterval(() => {
    if(SALTO !== desde || Date.now() >= hasta){ clearInterval(tic); r(); }
  }, 200);
});

function hoyISO(){
  // Fecha de Paraguay, no la del sistema (la notebook puede tener otro huso)
  return new Intl.DateTimeFormat("en-CA", {timeZone:"America/Asuncion"}).format(new Date());
}

// Un item vencido no se muestra más: el afiche del festival pasado no puede
// seguir girando en la tele. La fecha sale del nombre del archivo (tv_sync.py).
function vigente(item){
  if(!item || !item.hasta) return true;
  return item.hasta >= hoyISO();
}

/* ── Fotos ya vistas hoy ───────────────────────────────────────────────────────
   La tele repite el loop 2 horas y media: sin registro, las primeras fotos salían
   varias veces por noche y las últimas no salían nunca. El registro vive en el
   navegador de la tele (localStorage), así que sobrevive a la recarga de las 6 h y
   al apagón de la noche. Se guarda solo el nombre del archivo, no la URL entera. */

/* La clave lleva la MARCA: desde que una tele cambia de academia a mitad de la noche
   (14/09/2026), un solo registro compartido significaría que las 1.428 fotos de Mamba
   que salieron antes de las 19 se cuentan como "ya vistas" cuando entra Salsa. Son dos
   carteleras distintas y cada una lleva su propia cuenta. */
const LS_VISTAS = "tv_fotos_vistas:" + MARCA;
let vistasHoy = new Set();

function _claveFoto(item){
  return (item.url || "").split("/").pop();
}

function cargarVistas(){
  try{
    const crudo = localStorage.getItem(LS_VISTAS);
    if(!crudo) return;
    const d = JSON.parse(crudo);
    // Es de otro día: arranca de cero (para eso es "no repetir EN EL DÍA")
    if(d && d.dia === hoyISO() && Array.isArray(d.fotos)) vistasHoy = new Set(d.fotos);
  }catch(e){ console.warn("[TV] no pude leer las fotos vistas:", e.message); }
}

function guardarVistas(){
  try{
    localStorage.setItem(LS_VISTAS, JSON.stringify({dia: hoyISO(), fotos: [...vistasHoy]}));
  }catch(e){ /* modo privado o storage lleno: la tele sigue igual, solo repite */ }
}

/* ── Videos ya emitidos ────────────────────────────────────────────────────────
   Los videos no tenían registro y se repetían: medido sobre el guion real, en una
   noche de 3 h salían 36 videos pero solo 25 distintos, y en TRES noches 25 de los
   78 no habían salido nunca. Son dos causas sumadas: no había memoria de lo ya
   emitido, y el refresco del playlist (cada 10 min) vuelve a barajar y deja los
   cursores de cada colección en cero, así que el recorrido no avanzaba nunca.

   A diferencia de las fotos, este registro NO se borra al cambiar el día: con 36
   videos por noche y más de cien en la nube hacen falta varias noches para verlos
   todos, que es justo lo que Iván pedía. Se limpia solo cuando se agotaron. */

const LS_VIDEOS = "tv_videos_vistos:" + MARCA;   // por marca, igual que las fotos
let videosVistos = new Set();

function cargarVistos(){
  try{
    const crudo = localStorage.getItem(LS_VIDEOS);
    if(crudo){
      const d = JSON.parse(crudo);
      if(Array.isArray(d)) videosVistos = new Set(d);
    }
  }catch(e){ console.warn("[TV] no pude leer los videos vistos:", e.message); }
}

function guardarVistos(){
  try{ localStorage.setItem(LS_VIDEOS, JSON.stringify([...videosVistos])); }
  catch(e){ /* igual que con las fotos: sin storage la tele sigue, solo repite */ }
}

// Devuelve el primer video de la lista que todavía no salió. Si ya salieron todos,
// limpia SOLO los de esa lista y arranca otra vuelta: mejor repetir que quedarse sin
// video. `grupo` es una colección (usa su curV) o el pool de videos sueltos.
function videoNoVisto(grupo){
  const lista = grupo.videos ? grupo.videos : grupo;
  if(!lista.length) return null;
  const enColeccion = !!grupo.videos;
  let cur = enColeccion ? (grupo.curV || 0) : CURSOR.video;
  for(let i = 0; i < lista.length; i++){
    const cand = lista[(cur + i) % lista.length];
    if(!videosVistos.has(_claveFoto(cand))){
      const prox = (cur + i + 1) % lista.length;
      if(enColeccion) grupo.curV = prox; else CURSOR.video = prox;
      videosVistos.add(_claveFoto(cand));
      guardarVistos();
      return cand;
    }
  }
  console.log("[TV] ya salieron los " + lista.length + " videos de este grupo, otra vuelta");
  lista.forEach(v => videosVistos.delete(_claveFoto(v)));
  const primero = lista[0];
  videosVistos.add(_claveFoto(primero));
  guardarVistos();
  if(enColeccion) grupo.curV = 1; else CURSOR.video = 1;
  return primero;
}

/* ── El orden del día ──────────────────────────────────────────────────────────
   Dos cosas que pidió Iván el 06/09:

   1. "que cada día se vea algo diferente por semanas" — el orden de los eventos se
      baraja con la FECHA como semilla: cambia todos los días, pero se mantiene
      estable durante la noche (y sobrevive a la recarga de las 6 h).
   2. "el TBT hay que ir tirándolo todos los días también, y los jueves full" — la
      colección con día propio NO se esconde el resto de la semana: entra como una
      más. El día que le toca se intercala entre cada uno de los otros eventos, o
      sea que sale una de cada dos veces. */

function _semilla(txt){
  let h = 0;
  for(let i = 0; i < txt.length; i++) h = (h * 31 + txt.charCodeAt(i)) | 0;
  return Math.abs(h) || 1;
}

function mezclarConSemilla(a, txt){
  const x = a.slice();
  let s = _semilla(txt);
  const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for(let i = x.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

/* ── La rueda de los años ──────────────────────────────────────────────────────
   Pedido de Iván (14/09/2026), con el archivo ya en 18 años: cada tanda tira un año
   distinto, y sin orden cronológico — 2008, después 2018, después 2014. La rueda se
   baraja con la fecha Y CON EL NOMBRE DE LA TELE como semilla: cada pantalla del
   local recorre los mismos años en otro orden, así que a la misma hora ninguna está
   mostrando lo mismo que la de al lado. Que alguna vez coincidan no es un problema.

   El `turno` de la tele además la hace arrancar en otro punto de la rueda, para que
   no salgan todas juntas del mismo año cuando se prenden a la misma hora.

   NO hay año con día propio. Existía: la colección marcada con un día (el TBT, que
   viene de una carpeta "jueves") se intercalaba entre todas las demás y se llevaba
   media jornada. Iván lo dio de baja el 14/09/2026 — "el TBT no cambia los jueves,
   prácticamente todos los días es TBT, no es necesario algo diferente": con el
   archivo entero en la tele, todo lo que se muestra es un recuerdo, así que el TBT
   no es un día, es el material. Ahora su año entra en la rueda como uno más.
   El `dia` de la colección sigue viniendo en el playlist (lo pone tv_sync desde el
   nombre de la carpeta) pero la tele ya no lo mira. */

let BOLSAS = new Map();   // año → colecciones de ese año
let ANIOS = [];           // la rueda barajada de esta tele para hoy
let anioIdx = 0;          // NO se reinicia en el refresco del playlist: si se reiniciara,
                          // cada 10 minutos la tele volvería al mismo año de arranque
const CUR_ANIO = {};      // round-robin dentro de cada año

function armarRuedaDeAnios(lista){
  const bolsas = new Map();
  lista.forEach(c => {
    const k = c.anio ? String(c.anio) : "otros";
    if(!bolsas.has(k)) bolsas.set(k, []);
    bolsas.get(k).push(c);
  });
  BOLSAS = bolsas;

  ANIOS = mezclarConSemilla([...bolsas.keys()], hoyISO() + "|" + (TELE || "tv"));

  // Solo la primera vez: repartir las teles a lo largo de la rueda.
  if(!anioIdx && ANIOS.length) anioIdx = ((T ? T.turno : 0) * 5) % ANIOS.length;
  console.log("[TV] rueda de años (" + (TELE || "tv") + "): " + ANIOS.join(" → "));
}

// ¿Le queda algo que esta tele no haya visto todavía?
function _tieneAlgoSinVer(c){
  return c.videos.some(v => !videosVistos.has(_claveFoto(v))) ||
         c.fotos.some(f => !vistasHoy.has(_claveFoto(f)));
}

/* La colección de la próxima tanda: primero el AÑO, después la colección de ese año.

   Un año que ya dio TODO su material se saltea mientras quede otro con algo sin ver
   —"que en una noche no se repita el mismo material", Iván—: sin esto el 2008, que
   es una sola colección de 36 fotos y ningún video, volvía cada 17 tandas con
   exactamente las mismas fotos, mientras al 2024 (5 colecciones, 6.226 fotos) no le
   alcanzaba la noche. Cuando ya no queda nada sin ver en ningún año se da otra
   vuelta: mejor repetir que dejar la pantalla vacía. */
function colDelProximoAnio(){
  if(!ANIOS.length) return null;
  const recorrer = () => {
    for(let i = 0; i < ANIOS.length; i++){
      const anio = ANIOS[anioIdx++ % ANIOS.length];
      const bolsa = (BOLSAS.get(anio) || []).filter(c => c.videos.length || c.fotos.length);
      if(!bolsa.length) continue;
      const frescas = bolsa.filter(_tieneAlgoSinVer);
      if(!frescas.length) continue;      // este año ya salió entero esta noche
      const n = CUR_ANIO[anio] = (CUR_ANIO[anio] || 0) + 1;
      const c = frescas[(n - 1) % frescas.length];
      console.log("[TV] tanda del año " + anio + " → " + c.nombre);
      return c;
    }
    return null;
  };

  const c = recorrer();
  if(c) return c;

  /* Ya salió todo lo del día: se EMPIEZA OTRA JORNADA, no se elige un respaldo.

     Antes acá se devolvía la primera bolsa con material del recorrido, y esa elección
     se anclaba: el for avanza `anioIdx` una vez por año, así que la vuelta siguiente
     arrancaba en el mismo lugar, encontraba el mismo respaldo y devolvía la misma
     colección para siempre. Mientras la colección tuviera varias fotos no se notaba
     —`fotoNoVista` iba rotando—, pero con una de UNA sola foto y sin afiches fijos que
     la cortaran (Mamba no tiene), la cartelera se quedaba recargando esa única foto:
     pasó el 16/09/2026 en la pantalla de Mamba con CAMPUS MAMBA 2021.

     Limpiar el registro del día es lo que ya hacen `fotoNoVista` y `videoNoVisto`
     cuando se les acaba el grupo, y devuelve la rueda a girar por todos los años. */
  console.log("[TV] ya salió todo el archivo: se reinicia el registro del día");
  vistasHoy.clear();
  guardarVistas();
  const c2 = recorrer();
  if(c2) return c2;

  // Solo quedan colecciones de puros videos y ya salieron todos. Se reciclan también,
  // que es lo que hace videoNoVisto por grupo, antes de dejar la tanda sin material.
  console.log("[TV] tampoco quedan videos sin ver: se reinicia el registro de videos");
  videosVistos.clear();
  guardarVistos();
  return recorrer();
}

function mezclar(a){
  const x = a.slice();
  for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]]; }
  return x;
}

/* ── Carga del contenido ───────────────────────────────────────────────────── */

async function traerJSON(url, ms=12000){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  try{
    const r = await fetch(url + (url.includes("?")?"&":"?") + "t=" + Date.now(), {signal:ctrl.signal});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

// Fotos de las clases: mismas URLs que ve el alumno en /fotos, de las últimas N
// semanas. Es una ventana de TIEMPO, no un número de fechas: si una semana hubo
// clases todos los días entran todas, y lo viejo sale solo sin tocar nada.
function desdeISO(semanas){
  const d = new Date();
  d.setDate(d.getDate() - semanas * 7);
  return new Intl.DateTimeFormat("en-CA", {timeZone:"America/Asuncion"}).format(d);
}

// Devuelve las clases AGRUPADAS POR DÍA: la tele muestra todas las fotos de una misma
// clase juntas, con su fecha en pantalla, en vez de fotos sueltas sin contexto.
async function fotosDeClases(){
  if(!M.clases) return [];        // Mamba no tiene galería de clases por WhatsApp
  try{
    const man = await traerJSON(R2 + "/manifest.json");
    const limite = desdeISO(CFG.semanas_galeria || 8);
    const fechas = Object.keys(man.fechas || {}).filter(f => f >= limite).sort().reverse();
    return fechas.map(f => ({
      fecha: f,
      fotos: (man.fechas[f].fotos || []).map(u => ({
        tipo:"foto", url:u, fecha:f,
        titulo: fmtDiaFecha(f),                 // "Sábado 30 de agosto de 2026"
        subtitulo: man.fechas[f].titulo || "Nuestras clases"
      }))
    })).filter(d => d.fotos.length);
  }catch(e){
    console.warn("[TV] manifest de fotos no disponible:", e.message);
    return [];
  }
}

/* El año de una colección, para la rueda de años. Sale del playlist SIN tocar
   tv_sync.py: el campo `anio` viene solo cuando el nombre de la carpeta no lo trae
   ya adentro (así "FESTIVAL SALSA SOUL 2017 · 2017" no se lee dos veces), así que
   cuando falta se lo busca en la fecha escrita a mano y en el nombre del evento.
   Medido contra el playlist real del 14/09/2026: cubre 54 de las 57 colecciones.
   Las tres sin año (LADIES STYLE, NY SOCIAL, SHOWS IVAN & INGRID) caen juntas en la
   bolsa "otros", que gira en la rueda como un año más. */
function anioDeItem(it){
  if(typeof it.anio === "number") return it.anio;
  const m = ((it.fecha || "") + " " + (it.coleccion || "")).match(/(?:19|20)\d\d/);
  return m ? parseInt(m[0], 10) : null;
}

async function cargarPlaylist(){
  let pl = null;
  try{
    pl = await traerJSON(R2 + M.playlist);
  }catch(e){
    console.warn("[TV] playlist de R2 no disponible, uso la copia del repo:", e.message);
    // La copia de respaldo del repo es solo la de Salsa: si la de Mamba no está en R2,
    // no hay nada que mostrar y es mejor decirlo que mostrar la cartelera equivocada.
    try{ pl = await traerJSON(M.playlist); }
    catch(e2){ console.error("[TV] tampoco hay copia local:", e2.message); pl = null; }
  }
  if(!pl) return false;

  // La marca va ÚLTIMA: manda sobre lo que traiga el playlist, porque los nombres de
  // los afiches de Salsa no existen en el archivo de Mamba.
  CFG = {...CONFIG_DEFAULT, ...(pl.config || {}),
         afiches_horarios: M.afiches_horarios, afiche_social: M.afiche_social};
  // El volumen propio de la marca, solo si lo define: Salsa no lo define y sigue
  // tomando el del playlist, que es donde Iván lo puede tocar sin deploy.
  if(typeof M.volumen_musica === "number") CFG.volumen_musica = M.volumen_musica;

  // Lo que Iván sacó desde el mando no entra a los pools: se filtra acá, además del
  // chequeo del loop, para que tampoco cuente como material de su colección.
  cargarOcultas();
  const items = (pl.items || []).filter(vigente).filter(i => !OCULTAS.has(i.url));
  const nuevo = {video:[], foto:[], afiche:[], noticia:[], fijo:[], musica:[]};
  const cols = new Map();   // nombre del evento → {nombre, videos, fotos}

  items.forEach(it => {
    // El afiche marcado "fijo" sale de la rotación normal: se intercala en el bloque
    // del festival. Es lo que se está vendiendo ahora, no puede quedar librado al azar.
    if(it.fijo && it.tipo === "afiche"){ nuevo.fijo.push(it); return; }

    // Un video o una foto con colección pertenece a un evento: no van al pool suelto,
    // van a su festival, para que el video y SUS fotos salgan juntos.
    if(it.coleccion && (it.tipo === "video" || it.tipo === "foto")){
      if(!cols.has(it.coleccion))
        cols.set(it.coleccion, {nombre: it.coleccion, videos: [], fotos: [],
                                dia: (typeof it.dia === "number" ? it.dia : null),
                                anio: null});
      const c = cols.get(it.coleccion);
      if(c.anio === null) c.anio = anioDeItem(it);
      // Se lee el NOMBRE DEL ARCHIVO arriba y la marca del evento debajo. Si el
      // archivo trae el nombre que le puso la cámara ("IMG_7468", "5B7A1173"), no
      // hay nada que leer: se muestra el evento y listo.
      //
      // Debajo del evento va CUÁNDO y DÓNDE fue, que es lo que lo ata a un recuerdo
      // y no solo a un nombre de carpeta (pedido de Iván, 11/09/2026):
      //     Cuchi Cuchi
      //     FESTIVAL 15 AÑOS SALSA SOUL · Diciembre 2023 · Teatro Latino
      // Las tres partes son opcionales y se arman filtrando las vacías: de las 16
      // colecciones solo 9 tienen la ficha cargada, y una sin ficha tiene que
      // seguir leyéndose igual que hoy, sin un " · " colgado al final. `fecha` es
      // la escrita a mano ("Diciembre 2023") y `anio` el respaldo — tv_sync manda
      // una o el otro, nunca los dos.
      const cuando = [it.fecha || it.anio, it.lugar].filter(Boolean).join(" · ");
      const et = it.titulo_generico
        ? {titulo: it.coleccion, subtitulo: cuando}
        : {titulo: it.titulo,
           subtitulo: [it.coleccion, cuando].filter(Boolean).join(" · ")};
      if(it.tipo === "video") c.videos.push({...it, ...et});
      else c.fotos.push({...it, ...et, segundos: null});
      return;
    }
    // Sin colección no hay nombre de evento con qué reemplazar un título que no dice
    // nada ("video-output-B2A6C816-BBAA-48B1-A5E3-923B13845408"): se lo deja vacío y el
    // pie cae a la marca. La rama de arriba ya cubre a los que SÍ tienen colección.
    if(it.titulo_generico) it.titulo = "";
    if(nuevo[it.tipo]) nuevo[it.tipo].push(it);
  });

  nuevo.video = mezclar(nuevo.video);
  nuevo.foto = mezclar(nuevo.foto);
  nuevo.musica = mezclar(nuevo.musica);
  // Afiches y noticias NO se mezclan: van en el orden que Iván puso en la carpeta

  COLECCIONES = [...cols.values()].map(c => ({
    ...c, videos: mezclar(c.videos), fotos: mezclar(c.fotos), curV: 0, curF: 0
  }));
  armarRuedaDeAnios(COLECCIONES);
  DIAS_CLASE = await fotosDeClases();

  const total = nuevo.video.length + nuevo.foto.length + nuevo.afiche.length +
                nuevo.noticia.length + nuevo.fijo.length +
                COLECCIONES.length + DIAS_CLASE.length;
  if(!total){ console.warn("[TV] no hay contenido vigente"); return false; }

  POOL = nuevo;
  console.log("[TV] contenido: " + POOL.video.length + " videos sueltos · " +
              POOL.afiche.length + " afiches (+" + POOL.fijo.length + " fijo) · " +
              POOL.noticia.length + " noticias · " + POOL.musica.length + " temas · " +
              DIAS_CLASE.length + " días de clase");
  COLECCIONES.forEach(c => console.log("[TV]   🎬 " + c.nombre + ": " +
              c.videos.length + " videos · " + c.fotos.length + " fotos"));
  return true;
}

/* ── Elegir el próximo item ────────────────────────────────────────────────── */

// Recorre el patrón; si un tipo está vacío (todavía no hay videos, por ejemplo),
// salta al siguiente en vez de dejar la pantalla en negro.
// Una foto del grupo que hoy todavía no salió. Si ya salieron todas, limpia el
// registro y da otra vuelta: mejor repetir que dejar la pantalla sin fotos.
function fotoNoVista(grupo){
  const lista = grupo.fotos ? grupo.fotos : grupo;
  if(!lista.length) return null;
  const clave = grupo.fotos ? "curF" : null;
  let cur = clave ? grupo[clave] : CURSOR.foto;
  for(let i = 0; i < lista.length; i++){
    const cand = lista[(cur + i) % lista.length];
    if(!vistasHoy.has(_claveFoto(cand))){
      const prox = (cur + i + 1) % lista.length;
      if(clave) grupo[clave] = prox; else CURSOR.foto = prox;
      vistasHoy.add(_claveFoto(cand));
      guardarVistas();
      return cand;
    }
  }
  console.log("[TV] ya salieron las " + lista.length + " fotos de este grupo, otra vuelta");
  lista.forEach(f => vistasHoy.delete(_claveFoto(f)));
  guardarVistas();
  const primera = lista[0];
  vistasHoy.add(_claveFoto(primera));
  if(clave) grupo[clave] = 1; else CURSOR.foto = 1;
  return primera;
}

function _porTitulo(lista, titulo){
  const t = (titulo || "").toLowerCase().trim();
  return lista.find(a => (a.titulo || "").toLowerCase().trim() === t);
}

/* ── EL GUION ──────────────────────────────────────────────────────────────────
   El orden lo pidió Iván el 06/09, mirando la tele andando:

     1. un video de un festival
     2. 20 fotos DE ESE MISMO festival, 4s cada una,
        con el afiche del festival intercalado cada 5 fotos
     3. todos los afiches de horarios
     4. el afiche del próximo social
     5. TODAS las fotos de un día de clase, con su día y su fecha en pantalla
     … y de nuevo, con el siguiente festival.

   Es un generador y no una tabla de tipos: lo que manda es la SECUENCIA, y las
   fotos van atadas al video de su propio evento. Los videos que no pertenecen a
   ningún festival (los 60 del canal) ocupan el paso 1 cuando les toca el turno. */

let creditoPool = 0;

// UNA vuelta del guion. El `while(true)` vive afuera, en guion(), junto con la
// guarda que se asegura de que cada vuelta emita algo: acá adentro TODO lo que se
// emite está condicionado, y una cartelera sin videos, sin afiches de horarios y sin
// días de clase —Mamba Basket -- recorría la vuelta entera sin un solo yield. Un
// generador que no cede dentro de un while(true) no "no muestra nada": CUELGA la
// pestaña, y la TV de la academia se queda congelada hasta que alguien la reinicia.
function* unaVuelta(){
  {
    // Turnos alternados: una vuelta le toca a un festival (video + SUS fotos) y la
    // siguiente a un video suelto del canal. Sin esto, con un solo festival cargado
    // los 60 videos del canal no saldrían nunca.
    // Una colección SIN videos entra igual: sus fotos son todo lo que tiene, y si se
    // pide un video para mostrarlas, no salen nunca (le pasaba a GRAN CABARET, 39
    // fotos y 0 videos, y a las 13 colecciones de Mamba).
    //
    // El turno del pool suelto sale PROPORCIONAL a lo que tiene, con tope en la mitad.
    // Era una vuelta de cada dos, fija, y esa mitad se escribió cuando el pool eran los
    // 60 videos del canal. El 12/09/2026, con el archivo ya ordenado en colecciones, el
    // pool quedó con UN video ("El SUEÑO de la SALSA") contra 32 colecciones: se pasó
    // la jornada entera saliendo una vuelta sí y una no. Un grupo de uno no puede valer
    // lo que 32. El tope de 0.5 devuelve la alternancia de antes apenas el pool vuelve
    // a ser grande, que es para lo que se había escrito.
    const conMaterial = COLECCIONES.filter(c => c.videos.length || c.fotos.length).length;
    let usarCol = conMaterial > 0;
    if(usarCol && POOL.video.length){
      creditoPool += Math.min(0.5, POOL.video.length / (POOL.video.length + conMaterial));
      if(creditoPool >= 1){ creditoPool -= 1; usarCol = false; }
    }
    // La colección de esta tanda la elige la RUEDA DE AÑOS: un año distinto por
    // tanda, y dentro del año la colección que todavía tenga material sin ver. El
    // round-robin plano de antes (colIdx sobre todas las colecciones) salteaba lo ya
    // agotado pero no miraba de qué año era: quedaba toda la noche en 2024 y 2025,
    // que es donde está el 80% del archivo.
    const col = usarCol ? colDelProximoAnio() : null;

    if(col){
      // Si a la colección ya le salieron TODOS sus videos esta noche, la tanda va solo
      // con sus fotos: repetir el video es lo que Iván pidió que no pasara (14/09).
      // videoNoVisto() reinicia el registro cuando se acaban —está bien cuando no hay
      // otra cosa que poner—, y el TBT, con 2 videos y 2.213 fotos, se llevaba 14 de
      // los videos repetidos de una noche él solo. Solo se repite si tampoco quedan
      // fotas sin ver: antes que dejar la tanda vacía, mejor repetir.
      if(col.videos.length){
        const quedaVideo = col.videos.some(v => !videosVistos.has(_claveFoto(v)));
        const quedaFoto  = col.fotos.some(f => !vistasHoy.has(_claveFoto(f)));
        if(quedaVideo || !quedaFoto){
          const v = videoNoVisto(col);
          if(v) yield {...v};
        }
      }

      // Nunca más fotos de las que tiene el evento: con 4 fotos y un bloque de 20,
      // se veían las mismas cuatro cinco veces seguidas. Y nunca más de las que le
      // quedan SIN VER esta noche: YOSOYLASALSA tiene 36 fotos y en la segunda tanda
      // de su año pedía 20 más, así que las 4 últimas volvían a salir (14/09/2026).
      // Si ya no queda ninguna sin ver, se usa el largo entero y fotoNoVista da otra
      // vuelta — recién ahí se repite, que es mejor que una tanda sin fotos.
      const sinVer = col.fotos.filter(f => !vistasHoy.has(_claveFoto(f))).length;
      const cuantas = Math.min(CFG.fotos_por_festival || 20, sinVer || col.fotos.length);
      const cada = CFG.afiche_cada || 5;
      if(col.fotos.length){
        let afiches = 0;
        for(let i = 0; i < cuantas; i++){
          const f = fotoNoVista(col);
          if(f) yield {...f, segundos: CFG.segundos_foto_festival || 4};
          // El afiche del festival vuelve cada N fotos, no una sola vez al principio
          if((i + 1) % cada === 0 && POOL.fijo.length){
            const a = POOL.fijo[CURSOR.fijo++ % POOL.fijo.length];
            if(vigente(a)){ yield a; afiches++; }
          }
        }
        // Un evento con menos fotos que el corte no llegaría a mostrarlo nunca
        if(!afiches && POOL.fijo.length){
          const a = POOL.fijo[CURSOR.fijo++ % POOL.fijo.length];
          if(vigente(a)) yield a;
        }
      }else if(POOL.fijo.length){
        // Colección de puros videos (shows, reels): sin este corte se emitían los
        // 4 afiches del bloque seguidos, uno atrás del otro, sin una sola foto.
        const a = POOL.fijo[CURSOR.fijo++ % POOL.fijo.length];
        if(vigente(a)) yield a;
      }
    }else if(POOL.video.length){
      // Video suelto (los del canal): no tiene fotos propias, pero el afiche del
      // festival sale igual detrás — es lo que se está vendiendo.
      const v = videoNoVisto(POOL.video);
      if(v) yield v;
      if(POOL.fijo.length){
        const a = POOL.fijo[CURSOR.fijo++ % POOL.fijo.length];
        if(vigente(a)) yield a;
      }
    }

    // Los horarios, todos juntos, después del bloque del festival
    for(const nombre of (CFG.afiches_horarios || [])){
      const a = _porTitulo(POOL.afiche, nombre);
      if(a && vigente(a)) yield a;
    }
    const social = _porTitulo(POOL.afiche, CFG.afiche_social);
    if(social && vigente(social)) yield social;

    // Un día entero de clases: todas sus fotos seguidas, con la fecha en pantalla
    if(DIAS_CLASE.length){
      const dia = DIAS_CLASE[diaIdx++ % DIAS_CLASE.length];
      if(diaIdx % DIAS_CLASE.length === 0) DIAS_CLASE = mezclar(DIAS_CLASE);
      for(const f of dia.fotos) yield f;
    }

    // Una noticia para cerrar la vuelta
    if(POOL.noticia.length) yield POOL.noticia[CURSOR.noticia++ % POOL.noticia.length];
  }
}

function* guion(){
  while(true){
    let emitio = false;
    for(const item of unaVuelta()){ emitio = true; yield item; }
    if(emitio) continue;

    // La vuelta no emitió NADA. Antes esto era un cuelgue silencioso: el while
    // giraba sin ceder y la pantalla quedaba congelada. Se cae a lo único que
    // siempre hay en una cartelera —una foto— y si no hay ni eso, el generador
    // termina y quien llama muestra el aviso de "sin contenido" en vez de colgarse.
    const suelta = POOL.foto.length ? fotoNoVista(POOL.foto) : null;
    // Rotando, no find(): find devuelve siempre la PRIMERA colección con fotos, y si
    // esa tiene una sola foto, la guarda repite esa misma foto en cada vuelta — el
    // mismo vicio que tenía el respaldo de colDelProximoAnio (16/09/2026).
    const conFotos = COLECCIONES.filter(c => c.fotos.length);
    const deColeccion = conFotos.length
      ? conFotos[CURSOR.foto++ % conFotos.length]
      : null;
    const f = suelta || (deColeccion ? fotoNoVista(deColeccion) : null)
              || POOL.afiche[CURSOR.afiche++ % Math.max(1, POOL.afiche.length)];
    if(!f){ console.error("[TV] no hay NADA para mostrar"); return; }
    yield f;
  }
}

let _guion = null;
function siguienteItem(){
  if(!_guion) _guion = guion();
  const {value, done} = _guion.next();
  return done ? null : (value || null);
}

/* ── Música de fondo ───────────────────────────────────────────────────────────
   Suena mientras hay fotos, afiches y noticias; se desvanece y PAUSA cuando entra
   un video (que trae la música real de la coreografía) y retoma donde quedó.
   Un solo elemento <audio> para todo: así la música corre como una radio y no se
   reinicia con cada foto. */

let audioFondo = null;
let musicaIdx = 0;
let fadeTimer = null;

function volumenMusica(){
  const v = CFG.volumen_musica;
  return (typeof v === "number" && v >= 0 && v <= 1) ? v : 0.38;
}

function siguienteTema(){
  if(!POOL.musica.length) return;
  const t = POOL.musica[musicaIdx % POOL.musica.length];
  musicaIdx++;
  if(musicaIdx % POOL.musica.length === 0) POOL.musica = mezclar(POOL.musica);
  audioFondo.src = t.url;

  // Cada vez que un tema entra, arranca en un punto distinto. Los tramos de música
  // duran ~40s y las canciones 4-5 minutos: si empezaran siempre en el segundo 0,
  // en toda la noche se escucharía una y otra vez la misma intro.
  audioFondo.addEventListener("loadedmetadata", () => {
    const d = audioFondo.duration;
    if(isFinite(d) && d > 90){
      // Del primer 70%: nunca tan sobre el final que se corte a los pocos segundos.
      try{ audioFondo.currentTime = Math.random() * d * 0.7; }catch(e){}
    }
  }, {once:true});

  audioFondo.play().catch(e => {
    // Mismo bloqueo de autoplay que el video: seguimos sin música hasta que
    // alguien toque un botón del control.
    console.warn("[TV] música bloqueada por autoplay:", e.message);
    sonidoOk = false;
    document.getElementById("avisoSonido").classList.add("on");
  });
}

function prepararMusica(){
  if(audioFondo || !POOL.musica.length) return;
  audioFondo = new Audio();
  audioFondo.volume = 0;
  audioFondo.preload = "auto";
  // Un tema roto no puede callar la radio para siempre: se pasa al siguiente.
  audioFondo.addEventListener("ended", siguienteTema);
  audioFondo.addEventListener("error", () => {
    console.warn("[TV] tema sin cargar, paso al siguiente");
    setTimeout(siguienteTema, 500);
  });
}

function fundir(destino, ms){
  clearInterval(fadeTimer);
  return new Promise(res => {
    if(!audioFondo) return res();
    const paso = 40, desde = audioFondo.volume, saltos = Math.max(1, Math.round(ms/paso));
    let i = 0;
    fadeTimer = setInterval(() => {
      i++;
      audioFondo.volume = Math.min(1, Math.max(0, desde + (destino - desde) * (i/saltos)));
      if(i >= saltos){ clearInterval(fadeTimer); res(); }
    }, paso);
  });
}

async function musicaOn(){
  if(!POOL.musica.length || !sonidoOk) return;
  prepararMusica();
  // Cada tramo estrena tema Y fragmento: si retomara donde quedó, en toda la noche
  // se escucharía una sola canción avanzando de a 40 segundos.
  if(audioFondo.paused) siguienteTema();
  await fundir(volumenMusica(), 900);
}

async function musicaOff(){
  if(!audioFondo || audioFondo.paused) return;
  await fundir(0, 600);
  audioFondo.pause();          // pausa, no para: el tema retoma donde quedó
}

/* ── Pintar cada tipo de item ──────────────────────────────────────────────── */

function nuevaCapa(){
  const d = document.createElement("div");
  d.className = "capa";
  document.getElementById("escenario").appendChild(d);
  return d;
}

/* Soltar un <video> no es sacarlo del DOM: mientras conserve el src, el navegador
   sigue bajando el archivo entero (preload="auto", y acá hay videos de 90 MB) y no
   libera el buffer hasta que pase el recolector. En una Android TV con poca RAM eso
   se acumula noche tras noche. Hay que cortarle el src y hacerle load(). */
function soltarVideo(v){
  try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
}

// Descartar una capa que nunca llegó a mostrarse (el archivo no cargó).
function descartarCapa(capa){
  capa.querySelectorAll("video").forEach(soltarVideo);
  capa.remove();
}

function mostrarCapa(capa){
  requestAnimationFrame(()=>{ capa.classList.add("visible"); });
  const vieja = capaActual;
  capaActual = capa;
  if(vieja){
    vieja.classList.remove("visible");
    // se saca recién cuando terminó el fundido, para que no parpadee
    setTimeout(()=>{
      vieja.querySelectorAll("video").forEach(soltarVideo);
      vieja.remove();
    }, 1100);
  }
}

// El pie se cambia A MITAD del fundido de la imagen: si se cambia de una, durante
// casi un segundo la pantalla muestra la foto vieja con el titulo del item nuevo.
let _pieTimer = null;
function pie(titulo, sub){
  const p = document.getElementById("pie");
  p.style.opacity = "0";
  clearTimeout(_pieTimer);
  _pieTimer = setTimeout(()=>{
    document.getElementById("pieTitulo").textContent = titulo || M.nombre;
    document.getElementById("pieSub").textContent   = sub || M.lema;
    p.style.opacity = "1";
  }, 450);
}

function correrProgreso(segundos){
  const p = document.getElementById("progreso");
  p.style.transition = "none"; p.style.width = "0";
  requestAnimationFrame(()=>{
    p.style.transition = "width " + segundos + "s linear";
    p.style.width = "100%";
  });
}

/* La barra del VIDEO no puede ir con una transición de CSS: esa corre con el reloj y
   el video puede estar trabado. Se mueve con lo efectivamente reproducido, así que si
   la imagen se congela la barra también se frena — se ve que está esperando, no rota. */
function progresoEn(frac){
  const p = document.getElementById("progreso");
  p.style.transition = "width .4s linear";
  p.style.width = Math.max(0, Math.min(1, frac)) * 100 + "%";
}

// Vuelve la barra a cero SIN animar: si no, al entrar un video se la ve retroceder
// desde el 100% que dejó el item anterior.
function reiniciarProgreso(){
  const p = document.getElementById("progreso");
  p.style.transition = "none"; p.style.width = "0";
}

async function pintarVideo(item){
  const capa = nuevaCapa();
  const v = document.createElement("video");
  v.src = item.url;
  v.autoplay = true; v.muted = !sonidoOk; v.preload = "auto";
  v.setAttribute("playsinline", "");
  capa.appendChild(v);

  // Espera a que el video se pueda REPRODUCIR, no a que haya un frame. Con `loadeddata`
  // (un solo frame) arrancaba con el buffer casi vacío y se trababa a los segundos:
  // "varios videos se ven trancados" era esto. `canplay` es readyState 3, el navegador
  // ya calculó que tiene con qué seguir. Si en espera_video no llegó, seguimos igual con
  // lo que haya — el guard de abajo decide si sirve.
  await new Promise(res=>{
    let listo = false;
    const ok = ()=>{ if(!listo){ listo = true; res(); } };
    if(v.readyState >= 3) return ok();
    v.addEventListener("canplay", ok, {once:true});
    v.addEventListener("error", ok, {once:true});
    setTimeout(ok, CFG.espera_video * 1000);
  });

  // El corte es readyState < 2 (HAVE_CURRENT_DATA), no === 0: cuando la red se corta
  // a mitad el video queda en 1 (bajó los metadatos, no la imagen). Con el guard viejo
  // ese caso PASABA, fundía a una capa sin un solo frame y la pantalla quedaba NEGRA
  // hasta max_video —7 minutos— sin que nada avisara. Es lo que pasó el 08/09/2026.
  if(v.error || v.readyState < 2){
    console.warn("[TV] video sin imagen (readyState " + v.readyState + "), lo salteo:", item.url);
    descartarCapa(capa);
    return 0;
  }

  // Todo lo que no sea panorámico se muestra ENTERO sobre un fondo de degradado,
  // en vez de recortarle media imagen para llenar la pantalla: el vertical del
  // celular y también el CUADRADO de Instagram, al que el recorte le comía el 44%.
  // Vertical gana: un 608x1080 ya se muestra entero y no hay nada que corregirle.
  // Si es horizontal pero de poca altura (320x240, 640x352), tampoco se estira.
  if(v.videoWidth / v.videoHeight < 1.5) capa.classList.add("vertical");
  else if(v.videoHeight < 480) capa.classList.add("chico");

  mostrarCapa(capa);
  pie(item.titulo || M.nombre, item.subtitulo || M.lema);

  try{
    await v.play();
  }catch(e){
    // Política de autoplay: el navegador no deja audio sin gesto del usuario.
    // Con Chrome en kiosk (--autoplay-policy=no-user-gesture-required) esto no
    // pasa; si igual pasa, seguimos MUDOS antes que quedarnos sin video.
    console.warn("[TV] autoplay con sonido rechazado, sigo en mudo");
    sonidoOk = false;
    document.getElementById("avisoSonido").classList.add("on");
    v.muted = true;
    try{ await v.play(); }catch(e2){ descartarCapa(capa); return 0; }
  }

  const dur = Math.min(isFinite(v.duration) && v.duration > 1 ? v.duration : 30, CFG.max_video);

  /* El video se sigue por lo REPRODUCIDO, no por el reloj. Antes se cerraba con
     `setTimeout(dur*1000+800)`: cada segundo que el video pasaba trabado se le comía
     del final y la coreografía se cortaba a mitad de baile. Ahora hay tres salidas:
       · terminó (`ended`)
       · llegó al tope de max_video
       · se trabó: currentTime no avanza hace tranque_video segundos → se abandona,
         porque si no un video que nunca termina de bufferear se queda con la pantalla. */
  reiniciarProgreso();
  await new Promise(res=>{
    let fin = false, ultimoT = -1, quieto = 0, tic = null;
    const cerrar = motivo => {
      if(fin) return;
      fin = true;
      clearInterval(tic);
      if(motivo) console.warn("[TV] " + motivo + ":", item.url);
      res();
    };
    v.addEventListener("ended", ()=>cerrar(null), {once:true});
    v.addEventListener("error", ()=>cerrar("error de reproducción"), {once:true});

    const saltoAlEmpezar = SALTO;
    tic = setInterval(()=>{
      const t = v.currentTime;
      progresoEn(t / dur);
      if(SALTO !== saltoAlEmpezar) return cerrar(null);   // el mando pidió saltar
      if(t >= dur) return cerrar(null);            // tope de max_video
      quieto = (t > ultimoT + 0.05) ? 0 : quieto + 1;
      ultimoT = Math.max(ultimoT, t);
      if(quieto >= CFG.tranque_video) cerrar("video trabado, lo abandono");
    }, 1000);
  });
  return 1;
}

async function pintarFoto(item){
  const capa = nuevaCapa();
  const img = document.createElement("img");
  img.className = "foto";
  img.src = item.url;

  const ok = await new Promise(res=>{
    img.addEventListener("load", ()=>res(true), {once:true});
    img.addEventListener("error", ()=>res(false), {once:true});
    setTimeout(()=>res(false), 9000);
  });
  if(!ok){ console.warn("[TV] foto sin cargar, la salteo:", item.url); capa.remove(); return 0; }

  /* Entera o a pantalla completa, según la forma de la foto. El corte está en 1.45
     (entre una 4:3 y una 3:2): con la pantalla en 16:9, de una 3:2 `cover` se come
     el 16% del alto y no se lleva ninguna cara; de una 4:3, el 25%, y de una
     vertical, más de la mitad. Se mide con el tamaño REAL de la imagen, después de
     que cargó — el playlist no trae las dimensiones. */
  const proporcion = img.naturalWidth / (img.naturalHeight || 1);
  const entera = !(proporcion >= 1.45);   // el NaN de una imagen rota también va entera
  if(entera){
    img.classList.add("entera");
    if(!LIVIANO){
      const blur = document.createElement("img");
      blur.className = "fondoBlur"; blur.src = item.url;
      capa.appendChild(blur);
    }else{
      capa.classList.add("conAfiche");   // el degradado barato, sin blur
    }
  }

  const seg = item.segundos || CFG.segundos_foto;
  img.style.setProperty("--kb", (seg + 1.2) + "s");
  img.classList.add("kb");
  capa.appendChild(img);
  mostrarCapa(capa);

  // La foto de clase muestra su día y su fecha; la del festival, la marca del evento.
  // Los respaldos salen de la MARCA: con el nombre de Salsa clavado acá, la pantalla
  // de Mamba leía "CAMPUS MAMBA 2025 / Salsa Soul Studio" — una foto de básquet
  // firmada por la academia de baile.
  pie(item.titulo || M.nombre, item.subtitulo || M.lema);
  correrProgreso(seg);
  await dormir(seg*1000);
  return 1;
}

async function pintarAfiche(item){
  const capa = nuevaCapa();
  capa.classList.add("conAfiche");
  const img = document.createElement("img");
  img.className = "afiche"; img.src = item.url;

  const ok = await new Promise(res=>{
    img.addEventListener("load", ()=>res(true), {once:true});
    img.addEventListener("error", ()=>res(false), {once:true});
    setTimeout(()=>res(false), 9000);
  });
  if(!ok){ console.warn("[TV] afiche sin cargar, lo salteo:", item.url); capa.remove(); return 0; }

  if(!LIVIANO){
    // Fondo borroso con el propio afiche: sin esto quedan dos barras negras
    // enormes a los costados (los afiches son verticales).
    const blur = document.createElement("img");
    blur.className = "fondoBlur"; blur.src = item.url;
    capa.appendChild(blur);
  }
  capa.appendChild(img);
  mostrarCapa(capa);

  pie(item.titulo || M.nombre, item.subtitulo || M.pie_web);
  const seg = item.segundos || CFG.segundos_afiche;
  correrProgreso(seg);
  await dormir(seg*1000);
  return 1;
}

async function pintarNoticia(item){
  const capa = nuevaCapa();
  const div = document.createElement("div");
  div.className = "noticia";
  div.innerHTML =
    '<div class="kicker">' + escapar(item.kicker || "Novedades") + "</div>" +
    "<h1>" + escapar(item.titulo || "") + "</h1>" +
    '<div class="linea"></div>' +
    (item.texto ? "<p>" + escapar(item.texto) + "</p>" : "") +
    // El QR viene embebido en el playlist como data URI (lo arma tv_sync.py desde la
    // etiqueta QR: de noticias.txt). Igual va por escapar(): nada que entre por el
    // playlist se pega crudo en un atributo.
    (item.qr ? '<div class="qr"><img src="' + escapar(item.qr) + '" alt="">' +
               "<span>Escaneá con la cámara del celular</span></div>" : "");
  capa.appendChild(div);
  mostrarCapa(capa);

  pie(M.nombre, M.pie_web);
  // Una noticia con QR necesita más tiempo: hay que sacar el celular, desbloquearlo,
  // abrir la cámara y apuntar. Se le puede poner SEGUNDOS: en noticias.txt.
  const seg = item.segundos || CFG.segundos_noticia;
  correrProgreso(seg);
  await dormir(seg*1000);
  return 1;
}

function escapar(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
               "septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

function fmtFechaPie(iso){
  const p = iso.split("-").map(Number);
  return p[2] + " de " + MESES[p[1]-1] + " de " + p[0];
}

// "Sábado 30 de agosto de 2026" — Iván pidió que se lea el DÍA además de la fecha.
function fmtDiaFecha(iso){
  const p = iso.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]);           // fecha local, sin corrimiento de UTC
  return DIAS[d.getDay()] + " " + fmtFechaPie(iso);
}

/* ── El mando: escuchar órdenes y contar qué se ve ──────────────────────────── */

// El control vive al lado del playlist de la marca: /tv/… o /tv-mamba/…
const _base = () => (R2 + M.playlist).replace(/playlist\.json$/, "");

/* Avisa al server QUÉ está en pantalla, para que el mando pueda mostrarlo y ofrecer
   "sacá esta foto". Va por sendBeacon: no espera respuesta, no hace preflight de CORS
   y si el server no está, no pasa absolutamente nada. */
function contarQueSeVe(item){
  try{
    const cuerpo = JSON.stringify({
      marca: MARCA, tele: TELE || "", tipo: item.tipo || "",
      titulo: item.titulo || "", coleccion: item.coleccion || "", url: item.url || "",
    });
    navigator.sendBeacon(MANDO_API + "/tv/estado",
                         new Blob([cuerpo], {type: "text/plain"}));
  }catch(e){ /* la pantalla no depende de esto */ }
}

/* La lista de fotos que Iván sacó desde el celular. Se relee con el playlist. */
async function cargarOcultas(){
  try{
    const r = await fetch(_base() + "ocultas.json?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok) return;                       // 404 = nunca se ocultó nada, es lo normal
    const d = await r.json();
    OCULTAS = new Set((d.urls || []).filter(u => typeof u === "string"));
    if(OCULTAS.size) console.log("[TV] " + OCULTAS.size + " ocultas desde el mando");
  }catch(e){ /* sin lista, se muestra todo: el mando nunca deja la tele sin material */ }
}

/* Una orden dura ORDEN_VALE_SEG y se ejecuta UNA vez. Si la tele estaba apagada
   cuando se tocó el botón, al prender no tiene que ejecutar la orden de ayer. */
async function mirarMando(){
  try{
    const r = await fetch(_base() + "control.json?t=" + Date.now(), {cache: "no-store"});
    if(!r.ok) return;
    const o = await r.json();
    if(!o || !o.id || o.id === ordenHecha) return;
    const edad = Date.now()/1000 - (o.ts || 0);
    if(edad > (o.vale_seg || 60)){ ordenHecha = o.id; return; }   // vieja: se descarta
    if(o.tele && o.tele !== "todas" && o.tele !== (TELE || "")) return;  // no es para mí

    ordenHecha = o.id;
    try{ localStorage.setItem("tv_orden_hecha:" + MARCA, o.id); }catch(e){}
    if(o.recargar_ocultas) await cargarOcultas();
    if(o.accion === "saltar_coleccion") saltarColeccion = true;
    console.log("[TV] mando: " + o.accion);
    SALTO++;                                  // corta lo que esté en pantalla
  }catch(e){ /* sin mando, la cartelera sigue sola */ }
}

if(!APAGADA) setInterval(mirarMando, MANDO_CADA_MS);

/* ── El loop ───────────────────────────────────────────────────────────────── */

async function loop(){
  while(true){
    // La hora del cambio de academia, ejecutada entre un item y el siguiente
    if(cambioPendiente){
      console.log("[TV] recargando para " + cambioPendiente);
      location.reload();
      await dormir(60000);   // la recarga tarda: no seguir pintando mientras tanto
      continue;
    }
    let item = siguienteItem();

    /* "Saltar colección": se descartan los items que quedan de esta tanda hasta que
       cambie la colección. Con tope, porque el guion no promete cambiar nunca. */
    if(item && saltarColeccion){
      saltarColeccion = false;
      let n = 0;
      while(item && n < 80 && (item.coleccion || null) === ultimaColeccion){
        item = siguienteItem(); n++;
      }
      console.log("[TV] mando: colección saltada (" + n + " items descartados)");
    }

    /* Lo que Iván sacó desde el celular no se muestra más, sin esperar al sync. */
    if(item && item.url && OCULTAS.has(item.url)){
      console.log("[TV] oculta desde el mando, la salteo:", item.url);
      continue;
    }

    if(item){
      ultimaColeccion = item.coleccion || null;
      contarQueSeVe(item);
    }
    if(!item){
      // Sin contenido: esperar y reintentar, nunca dejar la pantalla muerta
      await mostrarEstado("Sin contenido para mostrar", "Reintentando…");
      await dormir(30000);
      if(await cargarPlaylist()) ocultarEstado();
      continue;
    }
    let ok = 0;
    try{
      // El video trae su propia música: la de fondo se aparta antes de que arranque.
      if(item.tipo === "video") await musicaOff(); else musicaOn();

      if(item.tipo === "video")        ok = await pintarVideo(item);
      else if(item.tipo === "foto")    ok = await pintarFoto(item);
      else if(item.tipo === "afiche")  ok = await pintarAfiche(item);
      else if(item.tipo === "noticia") ok = await pintarNoticia(item);
    }catch(e){
      console.error("[TV] error mostrando item:", e);
    }
    if(ok){
      fallosSeguidos = 0;
      if(sinConexion){
        sinConexion = false;
        ocultarEstado();
        console.log("[TV] volvió la conexión");
      }
      continue;
    }

    /* UN item que falla puede ser un archivo roto; TRES seguidos casi siempre es la red.
       La diferencia importa: por un archivo roto no hay que tapar la pantalla, pero por
       una caída SÍ hay que avisar. El 08/09/2026 la tele perdió el WiFi y se quedó en
       negro con la música sonando: desde afuera parecía rota y nadie sabía por qué. */
    /* `navigator.onLine === false` es el aviso del sistema de que se cayó la interfaz de
       red: sirve para no esperar tres fallos (con videos, cada uno cuesta espera_video y
       el cartel tardaba más de dos minutos en salir). Como positivo no vale nada —puede
       decir que hay red sin que haya internet— así que quien decide sigue siendo
       hayInternet(): si onLine miente, el chequeo real lo desmiente y no pasa nada. */
    fallosSeguidos++;
    if(fallosSeguidos >= 3 || !navigator.onLine){
      if(await hayInternet()){
        fallosSeguidos = 0;          // había red: eran archivos rotos, seguimos
        if(sinConexion){ sinConexion = false; ocultarEstado(); }
      }else{
        sinConexion = true;
        await mostrarEstado("Sin conexión", "La pantalla vuelve sola al restablecerse");
        fallosSeguidos = 3;          // seguir chequeando en cada vuelta, sin apurarse
        await dormir(15000);
      }
    }
  }
}

/* Prueba de conexión: le pide a R2 el índice de fotos (36 KB, el mismo que ya usa la
   página). NO se usa `cargarPlaylist()` a propósito: cuando R2 no contesta, esa función
   cae a la copia de respaldo del repo y REEMPLAZA todo el contenido por los 6 afiches
   de esa copia — un parpadeo de R2 dejaba la tele sin videos ni fotos hasta el próximo
   refresco. Preguntar si hay red no puede tener el efecto de vaciar la cartelera. */
async function hayInternet(){
  try{ await traerJSON(R2 + "/manifest.json", 8000); return true; }
  catch(e){ return false; }
}

async function mostrarEstado(msg, sub){
  document.querySelector("#estado .msg").textContent = msg;
  document.getElementById("estadoSub").textContent = sub || "";
  document.getElementById("estado").classList.remove("oculto");
}
function ocultarEstado(){ document.getElementById("estado").classList.add("oculto"); }

/* Desbloqueo del sonido cuando el navegador lo frenó por la política de autoplay.
   En la Smart TV no hay dedo ni mouse: el control remoto manda teclas (OK, flechas),
   por eso escuchamos también teclado. Un botón cualquiera y queda con audio para
   el resto de la noche. */
function desbloquearSonido(){
  if(sonidoOk) return;
  sonidoOk = true;
  document.getElementById("avisoSonido").classList.remove("on");
  document.querySelectorAll("video").forEach(v=>{
    v.muted = false;
    if(v.paused) v.play().catch(()=>{});
  });
  // Si no hay video en pantalla, lo que tiene que volver es la música de fondo
  if(!document.querySelector(".capa.visible video")) musicaOn();
  console.log("[TV] sonido desbloqueado");
}
["click", "keydown", "touchstart", "pointerdown"].forEach(
  ev => document.addEventListener(ev, desbloquearSonido)
);

/* La hora del cambio de academia (19:00 en la entrada, 19:15 en la cantina, 19:30 en
   el gimnasio). Cambiar de archivo es recargar la página entera —son otro playlist,
   otro logo y otro registro de lo ya visto—, así que NO se recarga en el acto: se
   marca el cambio y el loop lo ejecuta cuando termina el item que está en pantalla.
   De otra forma el reloj cortaría una coreografía a la mitad, que es justo lo que
   Iván pidió evitar cuando se subió el tope de los videos a 7 minutos. */
let cambioPendiente = null;
if(!APAGADA && T && T.cambio){
  setInterval(()=>{
    const ahora = marcaDeAhora();
    if(!cambioPendiente && ahora !== MARCA){
      cambioPendiente = ahora;
      console.log("[TV] " + T.nombre + " " + horaPY() + ": pasa a " + ahora +
                  " al terminar lo que está en pantalla");
    }
  }, 30000);
}

/* Refresco del playlist en caliente: el item que está en pantalla no se corta,
   el cambio entra en el siguiente. Iván actualiza la carpeta y en <10 min está. */
if(!APAGADA) setInterval(async ()=>{
  try{ await cargarPlaylist(); }catch(e){ console.warn("[TV] refresco falló:", e.message); }
}, CONFIG_DEFAULT.refresco_min * 60 * 1000);

/* Recarga completa cada tantas horas: limpia cualquier fuga de memoria si la
   notebook queda encendida más de lo previsto. */
if(!APAGADA) setTimeout(()=>location.reload(), CONFIG_DEFAULT.recarga_horas * 3600 * 1000);

/* ── Arranque ──────────────────────────────────────────────────────────────── */

(async function arrancar(){
  /* La tele de la tienda todavía no tiene material propio: pantalla negra con el
     logo de Salsa Soul y nada más. Se corta ACÁ, antes de pedirle un solo byte a R2:
     una pantalla apagada no puede estar bajando 19 GB de archivo toda la noche. */
  if(APAGADA){
    document.getElementById("marca").style.display = "none";
    document.querySelector("#estado .msg").textContent = "";
    document.getElementById("estadoSub").textContent = "";
    console.log("[TV] " + T.nombre + ": pantalla apagada (sin material asignado)");
    return;
  }

  cargarVistas();
  cargarVistos();
  if(vistasHoy.size) console.log("[TV] hoy ya salieron " + vistasHoy.size + " fotos");
  if(videosVistos.size) console.log("[TV] ya se emitieron " + videosVistos.size + " videos de la vuelta");
  await mostrarEstado("Preparando la pantalla…", "");
  let intentos = 0;
  while(!(await cargarPlaylist())){
    intentos++;
    await mostrarEstado("Esperando conexión…", "Intento " + intentos);
    await dormir(Math.min(10000 * intentos, 60000));
  }
  ocultarEstado();
  loop();
})();
</script>
